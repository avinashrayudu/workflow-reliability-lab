# Live-run settings. Built by Avinash Rayudu.
default_model: claude-sonnet-5-5
api_version: "2023-06-01"
max_tokens: 2048
temperature: 1.0        # the default; consistency is measured at the setting people actually use

# Prices in USD per million tokens, from the provider's pricing page (checked 2026-10-30).
# cache_write is the 5-minute cache write, cache_read a cache hit. Check them again before you trust a cost figure.
# Haiku 5.5 is priced by prompt length, counting cached tokens too.
prices_per_mtok:
  claude-opus-5-5:   {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.10}
  claude-haiku-5-5:  {input: 0.10, output: 0.50, cache_write: 0.125, cache_read: 0.01,
                     over_100k: {input: 0.50, output: 2.50, cache_write: 0.625, cache_read: 0.05}}
