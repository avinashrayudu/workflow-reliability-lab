    (select opening_cash from brands where brand_id='fernwood-goods') + sum(flow) over (order by week_index) closing
    from f) select round(min(closing), 2) from c where week_index >= 3
  v3: {skill: cash-position, calls: [[cash_path, {brand_id: fernwood-goods, basis: rollforward}]], pick: low_point}
