Q19:
  sql: >-
    with f as (select brand_id, week_index, sum(forecast) flow from weekly_cash where is_cash=1 group by brand_id, week_index),
    c as (select f.brand_id, b.opening_cash + sum(flow) over (partition by f.brand_id order by week_index) closing,
    b.cash_buffer from f join brands b using (brand_id)),
    l as (select brand_id, min(closing) low, max(cash_buffer) buf from c group by brand_id)
    select count(*) from l where low < buf
  v3: {skill: portfolio, calls: [[portfolio, {metric: low_point_vs_buffer}]], pick: count_below_buffer}
Q20:
  sql: >-
    with f as (select brand_id, week_index, sum(forecast) flow from weekly_cash where is_cash=1 group by brand_id, week_index),
    c as (select f.brand_id, b.opening_cash + sum(flow) over (partition by f.brand_id order by week_index) closing,
    b.cash_buffer from f join brands b using (brand_id)),
    l as (select brand_id, min(closing) / max(cash_buffer) ratio from c group by brand_id)
    select brand_id from l order by ratio limit 1
  v3: {skill: portfolio, calls: [[portfolio, {metric: low_point_vs_buffer}]], pick: lowest_ratio_brand}
