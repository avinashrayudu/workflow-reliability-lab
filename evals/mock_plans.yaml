B01:
  fields:
    low_point: Q16
    low_point_week:
      sql: >-
        with f as (select week_index, sum(case when week_index <= 2 then actual else forecast end) flow from weekly_cash
        where brand_id='fernwood-goods' and is_cash=1 group by week_index), c as (select week_index,
        (select opening_cash from brands where brand_id='fernwood-goods') + sum(flow) over (order by week_index) closing
        from f) select w.week_start from c join weeks w using (week_index) where week_index >= 3 order by closing limit 1
      v3: {calls: [[cash_path, {brand_id: fernwood-goods, basis: rollforward}]], pick: low_point_week}
    gap_to_buffer:
      sql: >-
        with f as (select week_index, sum(case when week_index <= 2 then actual else forecast end) flow from weekly_cash
        where brand_id='fernwood-goods' and is_cash=1 group by week_index), c as (select week_index,
        (select opening_cash from brands where brand_id='fernwood-goods') + sum(flow) over (order by week_index) closing
        from f) select round(max(0, (select cash_buffer from brands where brand_id='fernwood-goods') - min(closing)), 2)
        from c where week_index >= 3
      v3: {calls: [[cash_path, {brand_id: fernwood-goods, basis: rollforward}]], pick: gap_to_buffer}
    draw:
      sql: >-
        with f as (select week_index, sum(case when week_index <= 2 then actual else forecast end) flow from weekly_cash
        where brand_id='fernwood-goods' and is_cash=1 group by week_index), c as (select week_index,
        (select opening_cash from brands where brand_id='fernwood-goods') + sum(flow) over (order by week_index) closing
        from f), g as (select max(0, (select cash_buffer from brands where brand_id='fernwood-goods') - min(closing)) gap
        from c where week_index >= 3) select case when gap = 0 then 0 else (cast(gap / 25000 as int) +
        (gap > cast(gap / 25000 as int) * 25000)) * 25000 end from g
      v3: {calls: [[cash_path, {brand_id: fernwood-goods, basis: rollforward}]], pick: draw_to_hold_buffer}
    interest_one_week:
      sql: >-
        with f as (select week_index, sum(case when week_index <= 2 then actual else forecast end) flow from weekly_cash
        where brand_id='fernwood-goods' and is_cash=1 group by week_index), c as (select week_index,
        (select opening_cash from brands where brand_id='fernwood-goods') + sum(flow) over (order by week_index) closing
        from f), g as (select max(0, (select cash_buffer from brands where brand_id='fernwood-goods') - min(closing)) gap
        from c where week_index >= 3), d as (select case when gap = 0 then 0 else (cast(gap / 25000 as int) +
        (gap > cast(gap / 25000 as int) * 25000)) * 25000 end draw from g)
        select round(draw * (select loc_apr from brands where brand_id='fernwood-goods') / 52, 2) from d
      v3: {calls: [[credit_math, {brand_id: fernwood-goods, op: interest, amount: "{draw}", weeks: 1}]], pick: interest}
    top_refund_sku: Q07
    payout_variance: Q06
    largest_bill_this_week: Q09
