# Reference solutions, one per question, written in two forms:
#   sql   a single SQLite query over the tables (used by the mock for v1 and v2)
#   v3    the skill to load and the tool calls to make, and which result key holds the answer
# They are a second, independent computation of every answer: tests/test_truth.py requires
# them to agree with truth/build_truth.py (pandas). The offline mock replays them.
# shape: scalar (first cell; NULL or no row means abstain) | list (first column of every row)
# Built by Avinash Rayudu.

Q01:
  sql: >-
    with f as (select week_index, sum(forecast) flow from weekly_cash where brand_id='fernwood-goods' and is_cash=1
    group by week_index), c as (select week_index, (select opening_cash from brands where brand_id='fernwood-goods')
    + sum(flow) over (order by week_index) closing from f) select round(min(closing), 2) from c
  v3: {skill: cash-position, calls: [[cash_path, {brand_id: fernwood-goods, basis: forecast}]], pick: low_point}
Q02:
  sql: >-
    with f as (select week_index, sum(forecast) flow from weekly_cash where brand_id='fernwood-goods' and is_cash=1
    group by week_index), c as (select week_index, (select opening_cash from brands where brand_id='fernwood-goods')
    + sum(flow) over (order by week_index) closing from f)
    select w.week_start from c join weeks w using (week_index) order by closing limit 1
  v3: {skill: cash-position, calls: [[cash_path, {brand_id: fernwood-goods, basis: forecast}]], pick: low_point_week}
Q03:
  sql: >-
    with f as (select week_index, sum(forecast) flow from weekly_cash where brand_id='fernwood-goods' and is_cash=1
    group by week_index), c as (select week_index, (select opening_cash from brands where brand_id='fernwood-goods')
    + sum(flow) over (order by week_index) closing from f)
    select round(max(0, (select cash_buffer from brands where brand_id='fernwood-goods') - min(closing)), 2) from c
  v3: {skill: cash-position, calls: [[cash_path, {brand_id: fernwood-goods, basis: forecast}]], pick: gap_to_buffer}
Q04:
  sql: >-
    with f as (select week_index, sum(forecast) flow from weekly_cash where brand_id='fernwood-goods' and is_cash=1
    group by week_index), c as (select week_index, (select opening_cash from brands where brand_id='fernwood-goods')
    + sum(flow) over (order by week_index) closing from f),
    g as (select max(0, (select cash_buffer from brands where brand_id='fernwood-goods') - min(closing)) gap from c)
    select case when gap = 0 then 0 else (cast(gap / 25000 as int) + (gap > cast(gap / 25000 as int) * 25000)) * 25000 end from g
  v3: {skill: credit-line, calls: [[cash_path, {brand_id: fernwood-goods, basis: forecast}]], pick: draw_to_hold_buffer}
Q05:
  sql: >-
    select round((select opening_cash from brands where brand_id='fernwood-goods') + sum(actual), 2) from weekly_cash
    where brand_id='fernwood-goods' and is_cash=1 and week_index <= 2
  v3: {skill: cash-position, calls: [[cash_path, {brand_id: fernwood-goods, basis: rollforward}]], pick: "weeks.2.closing_cash"}
