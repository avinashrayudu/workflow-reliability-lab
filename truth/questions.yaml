# The workflow itself: the Monday brief, scored field by field, plus every dollar figure in its text.
brief:
  id: B01
  brand: fernwood-goods
  q: >-
    Write Fernwood Goods' Cash Brief for Monday 2026-11-16. Return one JSON object with these keys:
    low_point (roll-forward low point from the week of 2026-11-16 onward), low_point_week (its week_start),
    gap_to_buffer, draw (credit draw in multiples of $25,000 to hold the buffer), interest_one_week (interest on
    that draw for one week), top_refund_sku (largest refund overrun over weeks 0 to 2), payout_variance
    (dtc_payouts actual minus forecast, weeks 0 to 2), largest_bill_this_week (bill_id of the largest bill due the
    week of 2026-11-16), and narrative (four to six sentences for the founder, citing dollar figures). Put the
    JSON on its own line at the end. If something can't be computed from the data, set it to null.
  fields:
    low_point: money
    low_point_week: date
    gap_to_buffer: money
    draw: money
    interest_one_week: money
    top_refund_sku: text
    payout_variance: money
    largest_bill_this_week: text
